<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go-Farkle: 10k Challenge</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #2c3e50; color: white; margin: 0; padding: 20px; }
        .game-container { max-width: 600px; margin: 0 auto; padding: 30px; background: #34495e; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative; }
        
        #win-msg { 
            display: none; background: #f1c40f; color: #2c3e50; padding: 30px; 
            border-radius: 10px; margin-bottom: 20px; border: 4px solid #d4ac0d;
            animation: bounce 0.5s ease-in-out;
        }
        @keyframes bounce { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

        .stats { display: flex; justify-content: space-around; margin-bottom: 20px; background: #2c3e50; padding: 15px; border-radius: 10px; border: 1px solid #455a64; }
        .stat-box { font-size: 1.1rem; }
        .stat-value { display: block; font-size: 1.8rem; font-weight: bold; color: #f1c40f; }

        .dice-container { display: flex; justify-content: center; flex-wrap: wrap; gap: 15px; margin: 30px 0; min-height: 100px; }
        .die { 
            width: 70px; height: 70px; background: #ecf0f1; color: #2c3e50; border-radius: 12px; 
            display: flex; align-items: center; justify-content: center; font-size: 2.2rem; font-weight: bold; 
            cursor: pointer; transition: all 0.2s ease; user-select: none; box-shadow: 0 5px 0 #bdc3c7;
        }
        .die:hover { transform: translateY(-3px); background: #fff; }
        .die.selected { 
            background: #f1c40f; color: #2c3e50; transform: translateY(5px); 
            box-shadow: 0 0 15px rgba(241, 196, 15, 0.5); border: 2px solid #d4ac0d;
        }
        .die.farkled { opacity: 0.5; cursor: default; filter: grayscale(1); box-shadow: none; transform: none; }

        .controls { display: flex; justify-content: center; gap: 15px; margin-top: 30px; }
        .btn { padding: 12px 30px; font-size: 1.1rem; cursor: pointer; border: none; border-radius: 8px; font-weight: bold; transition: opacity 0.2s; }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .btn-roll { background: #27ae60; color: white; }
        .btn-bank { background: #e67e22; color: white; }
        .btn-reset { background: #34495e; color: white; border: 1px solid white; margin-top: 10px; }
        
        .farkle-msg { color: #e74c3c; font-size: 2.5rem; font-weight: bold; margin: 20px 0; display: none; text-shadow: 2px 2px 0 #000; }
        .dice-info { color: #bdc3c7; font-style: italic; margin-top: 10px; }
    </style>
</head>
<body>

<div class="game-container">
    <div id="win-msg">
        <h2 style="margin: 0;">🏆 CHAMPION! 🏆</h2>
        <p>You hit the 10,000 point goal!</p>
        <button class="btn btn-reset" onclick="resetGame()">Start New Game</button>
    </div>

    <h1>🎲 Go-Farkle</h1>
    
    <div class="stats">
        <div class="stat-box">Turn Score <span id="turn-score" class="stat-value">0</span></div>
        <div class="stat-box">Total Bank <span id="total-bank" class="stat-value">0</span></div>
    </div>

    <div id="farkle-msg" class="farkle-msg">FARKLE!</div>

    <div class="dice-container" id="dice-display"></div>

    <p class="dice-info">Dice left to roll: <span id="dice-left">6</span></p>

    <div class="controls">
        <button id="roll-btn" class="btn btn-roll" onclick="roll()">Roll Dice</button>
        <button id="bank-btn" class="btn btn-bank" onclick="bank()">Bank Points</button>
    </div>
</div>

<script>
    let selectedIndices = new Set();

    async function updateUI(data) {
        // Update texts
        document.getElementById('turn-score').innerText = data.turn.accumulated_score;
        document.getElementById('total-bank').innerText = data.total_bank;
        document.getElementById('dice-left').innerText = data.turn.dice_remaining;

        // Farkle Check: Must be marked game_over AND have dice showing
        const hasDice = data.last_roll && data.last_roll.length > 0;
        const isFarkle = data.turn.is_game_over && hasDice;
        document.getElementById('farkle-msg').style.display = isFarkle ? 'block' : 'none';
        
        selectedIndices.clear();

        // Win State
        const winMsg = document.getElementById('win-msg');
        if (data.winner) {
            winMsg.style.display = 'block';
            document.getElementById('roll-btn').disabled = true;
            document.getElementById('bank-btn').disabled = true;
        } else {
            winMsg.style.display = 'none';
            document.getElementById('roll-btn').disabled = false;
        }

        // Bank button is only for non-farkle scoring turns
        document.getElementById('bank-btn').disabled = (isFarkle || data.turn.accumulated_score === 0 || data.winner);

        // Render Dice
        const diceDiv = document.getElementById('dice-display');
        diceDiv.innerHTML = '';

        if (hasDice && !data.winner) {
            data.last_roll.forEach((val, index) => {
                const die = document.createElement('div');
                die.className = 'die' + (isFarkle ? ' farkled' : '');
                die.innerText = val;
                if (!isFarkle) {
                    die.onclick = () => toggleDie(die, index);
                }
                diceDiv.appendChild(die);
            });
        }
    }

    function toggleDie(element, index) {
        if (selectedIndices.has(index)) {
            selectedIndices.delete(index);
            element.classList.remove('selected');
        } else {
            selectedIndices.add(index);
            element.classList.add('selected');
        }
    }

    async function roll() {
        const diceToKeep = [];
        const diceElements = document.querySelectorAll('.die');
        
        selectedIndices.forEach(index => {
            diceToKeep.push(parseInt(diceElements[index].innerText));
        });

        const res = await fetch('/api/roll', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ dice_to_keep: diceToKeep })
        });
        
        const data = await res.json();
        updateUI(data);
    }

    async function bank() {
        const res = await fetch('/api/bank');
        const data = await res.json();
        updateUI(data);
    }

    async function resetGame() {
        const res = await fetch('/api/reset');
        const data = await res.json();
        updateUI(data);
    }

    window.onload = async () => {
        const res = await fetch('/api/bank');
        const data = await res.json();
        updateUI(data);
    };
</script>
</body>
</html>
